<!DOCTYPE html>
<html>
  <head>
    <title>Page Ruler</title>
    <link type="text/css" rel="stylesheet" href="options.css">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  </head>
  <body>
    <div class="logo"></div>
    <div class="toolbar">
			<table>
				<tr>
					<td id="reload" title="Reload UI">
						<svg height="13" width="13" viewBox="0 0 512 512">
							<path d="M281.525,228.102l104.758-78.042 c12.082-12.085,12.082-24.259,0-36.342L281.525,35.674c-3.274-2.359-7.359-3.725-11.723-3.725c-10.992,0-19.803,8.536-19.803,19.083  v35.429C144.611,86.737,59.205,172.046,59.205,277.258c0,105.396,85.672,190.793,191.248,190.793 c98.03,0,178.809-73.498,189.977-168.169c0.092-0.275,0.367-3.187,0.367-4.455c0-9.992-8.181-18.169-18.261-18.169h-45.793 c-14.993,0-26.349,10.355-27.893,18.986c-8.811,46.156-49.519,80.954-98.397,80.954c-55.329,0-100.127-44.701-100.127-99.94 c0-55.064,44.523-99.667,99.674-99.941v35.437c0,10.541,8.811,19.076,19.803,19.076C274.166,231.83,278.251,230.471,281.525,228.102 z"/>
						</svg>
					</td>
				</tr>
        <tr>
          <td id="theme" title="Dark | Light mode">
            <svg width="11" height="11" viewBox="0 0 122.8799 122.8799">
              <path d="M 63.550085,1.4875858 A 60.101027,60.101027 0 0 0 3.45,61.587666 60.101027,60.101027 0 0 0 63.550085,121.6899 60.101027,60.101027 0 0 0 119.56373,83.196612 50.463617,50.463617 0 0 1 102.0998,86.352622 50.463617,50.463617 0 0 1 51.637166,35.887862 50.463617,50.463617 0 0 1 65.189815,1.5691534 60.101027,60.101027 0 0 0 63.550085,1.4875858 Z"/>
            </svg>
          </td>
        </tr>
				<tr>
					<td id="support" title="Open support page">
						<svg height="12" width="12" viewBox="0 0 1792 1792">
							<path d="M1088 1256v240q0 16-12 28t-28 12h-240q-16 0-28-12t-12-28v-240q0-16 12-28t28-12h240q16 0 28 12t12 28zm316-600q0 54-15.5 101t-35 76.5-55 59.5-57.5 43.5-61 35.5q-41 23-68.5 65t-27.5 67q0 17-12 32.5t-28 15.5h-240q-15 0-25.5-18.5t-10.5-37.5v-45q0-83 65-156.5t143-108.5q59-27 84-56t25-76q0-42-46.5-74t-107.5-32q-65 0-108 29-35 25-107 115-13 16-31 16-12 0-25-8l-164-125q-13-10-15.5-25t5.5-28q160-266 464-266 80 0 161 31t146 83 106 127.5 41 158.5z"/>
						</svg>
					</td>
				</tr>
				<tr>
					<td id="donation" title="Make a donation">
						<svg height="12" width="12" viewBox="-0.709 -11.555 141.732 141.732">
							<path d="M140.314,37.654C140.314,16.858,123.402,0,102.537,0c-13.744,0-25.77,7.317-32.379,18.255C63.549,7.317,51.521,0,37.777,0 C16.912,0,0,16.858,0,37.654c0,10.821,4.588,20.57,11.922,27.438h-0.01l54.084,51.584c0.992,1.188,2.48,1.945,4.148,1.945 c1.545,0,2.936-0.653,3.92-1.696l54.346-51.833h-0.016C135.729,58.225,140.314,48.476,140.314,37.654"/>
						</svg>
					</td>
				</tr>
			</table>
		</div>
    <div class="content">
      <table class="settings">
        <tr class="header">
          <td>
			<span class="icon">⬤</span>
			<span class="name">Settings</span>
		  </td>
          <td></td>
          <td colspan="2">Note</td>
        </tr>
        <tr>
          <td>
            <label for="scroll">Move Metrics</label>
          </td>
          <td>
            <input type="checkbox" id="scroll">
          </td>
          <td colspan="2" class="note">
            Move metrics placement as the page scrolls in X or Y directions
          </td>
        </tr>
        <tr>
          <td>
            <label for="scroll">Auto Color Adjustment</label>
          </td>
          <td>
            <input type="checkbox" id="adjust">
          </td>
          <td colspan="2" class="note">
            Auto-adjust line colors for optimal visibility across light and dark pages
          </td>
        </tr>
      </table>
      <table class="metrics">
        <tr class="header">
          <td>
			<span class="icon">⬤</span>
			<span class="name">Placements</span>
		  </td>
          <td></td>
          <td colspan="2">Screenshots</td>
        </tr>
        <tr>
          <td>
            <label for="grayscale">Metrics Placement #1 - Grayscale</label>
          </td>
          <td>
            <input type="checkbox" id="grayscale">
          </td>
          <td class="grayscale-1"></td>
          <td class="grayscale-2"></td>
        </tr>
        <tr>
          <td>
            <label for="colorful">Metrics Placement #2 - Colorful</label>
          </td>
          <td>
            <input type="checkbox" id="colorful">
          </td>
          <td class="colorful-1"></td>
          <td class="colorful-2"></td>
        </tr>
        <tr>
          <td>
            <label for="circular">Metrics Placement #3 - Circular</label>
          </td>
          <td>
            <input type="checkbox" id="circular">
          </td>
          <td class="circular-1"></td>
          <td class="circular-2"></td>
        </tr>
        <tr>
          <td>
            <label for="linear">Metrics Placement #4 - Linear</label>
          </td>
          <td>
            <input type="checkbox" id="linear">
          </td>
          <td class="linear-1"></td>
          <td class="linear-2"></td>
        </tr>
        <tr>
          <td>
            <label for="angular">Metrics Placement #5 - Angular</label>
          </td>
          <td>
            <input type="checkbox" id="angular">
          </td>
          <td class="angular-1"></td>
          <td class="angular-2"></td>
        </tr>
      </table>
    </div>
    <script type="text/javascript" src="options.js"></script>
  </body>
</html>
